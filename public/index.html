<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뭐먹.zip</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 배경 데코: Y2K 심볼 + 음식 이모지 -->
  <div class="deco-layer" aria-hidden="true">
    <span style="top:5%;  left:4%;  font-size:26px; animation-delay:0s">🍜</span>
    <span style="top:10%; right:6%; font-size:16px; animation-delay:1s">×</span>
    <span style="top:8%;  left:20%; font-size:14px; animation-delay:0.4s">○</span>
    <span style="top:18%; right:14%;font-size:24px; animation-delay:2s">🍣</span>
    <span style="top:22%; left:7%;  font-size:14px; animation-delay:1.5s">✦</span>
    <span style="top:32%; right:5%; font-size:22px; animation-delay:0.8s">☕</span>
    <span style="top:38%; left:3%;  font-size:14px; animation-delay:3s">×</span>
    <span style="top:46%; right:8%; font-size:24px; animation-delay:0.2s">🧁</span>
    <span style="top:52%; left:5%;  font-size:22px; animation-delay:1.8s">🍱</span>
    <span style="top:60%; right:4%; font-size:14px; animation-delay:0.6s">○</span>
    <span style="top:68%; left:4%;  font-size:24px; animation-delay:2.5s">🥢</span>
    <span style="top:74%; right:6%; font-size:22px; animation-delay:1.2s">🍰</span>
    <span style="top:82%; left:6%;  font-size:14px; animation-delay:0.9s">✦</span>
    <span style="top:88%; right:7%; font-size:22px; animation-delay:1.7s">🥗</span>
  </div>

  <header>
    <div class="header-center">
      <div class="header-deco-row">
        <span>🍜</span><span>🍣</span><span>🧁</span><span>🍝</span><span>☕</span>
      </div>
      <div class="title-blob">
        <h1>뭐먹.zip</h1>
      </div>
      <div class="header-sub-row">
        <span class="subtitle-pill">🍴 오늘 뭐 먹지, 고민될 때! 🥢</span>
      </div>
    </div>
  </header>

  <main>
    <section class="filter-section">

      <div class="filter-group">
        <h2>🪑 어떤 자리에요?</h2>
        <div class="filter-buttons" id="filter-type">
          <button class="filter-btn active" data-value="all">🤷 상관없음</button>
          <button class="filter-btn" data-value="solo">🍱 혼밥</button>
          <button class="filter-btn" data-value="couple">👫 2인</button>
          <button class="filter-btn" data-value="small">🎉 소모임 (3~7인)</button>
          <button class="filter-btn" data-value="group">🎊 단체 (8인+)</button>
        </div>
      </div>

      <div class="filter-group">
        <h2>🍽️ 어떤 메뉴에요? <span class="multi-hint">복수선택 가능</span></h2>
        <div class="filter-buttons" id="filter-food">
          <button class="filter-btn active" data-value="all">🤷 상관없음</button>
          <button class="filter-btn toggle" data-value="korean">🍲 한식</button>
          <button class="filter-btn toggle" data-value="japanese">🍣 일식</button>
          <button class="filter-btn toggle" data-value="chinese">🥟 중식</button>
          <button class="filter-btn toggle" data-value="western">🍝 양식</button>
          <button class="filter-btn toggle" data-value="bunsik">🍢 분식</button>
          <button class="filter-btn toggle" data-value="chicken">🍗 치킨</button>
          <button class="filter-btn toggle" data-value="fastfood">🍔 패스트푸드</button>
          <button class="filter-btn toggle" data-value="sandwich">🥪 샌드위치</button>
<button class="filter-btn toggle" data-value="pub">🍻 술집</button>
          <button class="filter-btn toggle" data-value="cafe">☕ 카페/디저트</button>
        </div>
      </div>

      <div class="filter-group">
        <h2>🔖 조건이 있나요? <span class="multi-hint">복수선택 가능</span></h2>
        <div class="filter-buttons" id="filter-condition">
          <button class="filter-btn toggle" data-value="reservation">📞 예약 가능</button>
          <button class="filter-btn toggle" data-value="parking">🅿️ 주차 가능</button>
          <button class="filter-btn toggle" data-value="takeout">🥡 포장 가능</button>
          <button class="filter-btn toggle" data-value="room">🚪 룸 있음</button>
          <button class="filter-btn toggle" data-value="terrace">🌿 야외/테라스</button>
          <button class="filter-btn toggle" data-value="latenight">🌙 심야 영업</button>
        </div>
      </div>

      <div class="filter-group location-group">
        <h2>📍 어디서 찾을까요?</h2>
        <div class="location-input">
          <input type="text" id="location-input" placeholder="동네나 장소 입력 (비우면 전국 검색)" />
          <button id="location-btn">🗺️ 현재 위치</button>
        </div>
      </div>

      <div class="search-btn-wrap">
        <button class="search-btn" id="search-btn">🔍 맛집 찾기 ✦</button>
        <button class="reset-btn" id="reset-btn">↺ 초기화</button>
      </div>

    </section>

    <section class="results-section" id="results-section">
      <p class="results-title" id="results-title"></p>
      <button class="random-btn" id="random-btn" style="display:none">🎲 랜덤 뽑기</button>
      <div class="condition-notice" id="condition-notice" style="display:none"></div>
      <div class="results-placeholder" id="results-placeholder">
        <div class="placeholder-icon">🗺️</div>
        <p>필터를 선택하고<br><strong>맛집 찾기</strong>를 눌러보세요</p>
      </div>
      <div class="results-list" id="results-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
